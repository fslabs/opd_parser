[package]
name = "opd-parser"
description = "Parser for the OPD point cloud animation format"
version = "0.6.0"
edition = "2021"
authors = [
    "Zhixing Zhang <zhixing.zhang@foresightmining.com>"
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/fslabs/opd_parser"
# Cargo's own allowlist, checked before any upload. Omitting crates-io here is
# what kept 0.6.0 off the public registry while fsl moved ahead: `cargo publish`
# refuses with "the registry `crates-io` is not listed in the `package.publish`
# value". "crates.io" is not a legal registry name to cargo and cannot be used.
publish = ["fsl", "crates-io"]


[dependencies]
nom = "7"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# fslabscli reads this to decide what `fslabscli publish` does. `allow_public`
# adds crates.io alongside the `fsl` registry from `publish` above, preserving
# the public release the retired rust-build.yml did with publish_public_registry.
[package.metadata.fslabs.publish.cargo]
allow_public = true
